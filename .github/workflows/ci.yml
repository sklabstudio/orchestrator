name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      # L3/L4 integration tests exercise the real Skill Hub + PatchBench
      # contract (python API with CLI fallback), so install both siblings.
      - run: pip install "sklab-skill-hub @ git+https://github.com/sklabstudio/skill-hub.git" "patchbench @ git+https://github.com/sklabstudio/patchbench.git"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q
      - run: python -m build
      - run: pip install dist/*.whl --force-reinstall && sklab-run --version && sklab-run --help && sklab-run doctor
